# Native (Cygwin-free) Windows build, MinGW-w64, cross-compiled from Linux, then
# exercised on a Windows runner.
#
#   build : cross-compiles the CLI (ais.exe, with the web GUI and LAN sync over
#           Winsock) and the native window (win32/ais-gui.exe). Both gate: they
#           run on every push/PR touching c/ or win32/ and must stay green. The
#           window broke silently once when LAN sync put SIGPIPE and sockets
#           into embed.c; building it automatically is what stops that recurring.
#   test  : runs the CLI black-box suite (tests/cli.sh) and the loopback sync
#           (tests/sync.sh) against ais.exe on windows-latest, under Git Bash.
#           This is the only place the Windows binary is ever run: the
#           developers' machines have no Windows and no wine. The engine's
#           in-process tests (c/tests.c) fork and exec, so they are not built
#           for Windows; the CLI suite covers the same engine from outside.
name: native-windows

on:
  push:
    branches: [main]
    paths: ['c/**', 'win32/**', 'tests/cli.sh', 'tests/sync.sh', '.github/workflows/native-windows.yml']
  pull_request:
    paths: ['c/**', 'win32/**', 'tests/cli.sh', 'tests/sync.sh', '.github/workflows/native-windows.yml']
  workflow_dispatch:

jobs:
  build:
    name: cross-compile ais.exe and ais-gui.exe (gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags so `git describe` sees the tag

      - name: install MinGW-w64 (gcc + windres)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      # A CC naming mingw makes c/Makefile pick gnu99, the Winsock libraries and
      # the .exe name; -static folds in libgcc so the exe stands alone.
      - name: cross-compile the CLI
        run: |
          make -C c clean
          make -C c CC=x86_64-w64-mingw32-gcc LDFLAGS=-static
          file c/ais.exe

      - name: cross-compile the native window
        run: |
          make -C win32 CC=x86_64-w64-mingw32-gcc WINDRES=x86_64-w64-mingw32-windres
          file win32/ais-gui.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ais-windows-x86_64
          path: |
            c/ais.exe
            win32/ais-gui.exe

  test:
    name: run the CLI and sync suites on Windows (gates)
    needs: build
    runs-on: windows-latest
    # The suites take minutes here (Defender scans each of the ~1500 process
    # launches). The first run hung for 35 minutes on a prompt that waited at
    # an unattended console; a hang must fail, not run out the six-hour default.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ais-windows-x86_64
          path: bin

      - name: the binary runs
        run: |
          ./bin/c/ais.exe --version
          ./bin/c/ais.exe --help | head -5

      - name: tests/cli.sh
        run: sh tests/cli.sh "$PWD/bin/c/ais.exe"

      - name: tests/sync.sh (two peers over loopback, Winsock)
        run: sh tests/sync.sh "$PWD/bin/c/ais.exe"
