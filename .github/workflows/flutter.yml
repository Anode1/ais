# The Flutter app's own gate.
#
# Until this existed, nothing ran `flutter analyze` or `flutter test` outside a
# release build: the only Flutter job in the repo was the tagged `android` job in
# release.yml, which builds but never tests. So a Dart regression was found by
# tagging a release -- the most expensive moment to find one -- and the widget
# tests under app/flutter/test/ were run by hand or not at all.
#
# Pinned to a Flutter VERSION, not `stable`. The Android SDK levels and the NDK
# come from `flutter.compileSdkVersion` / `flutter.ndkVersion` in
# android/app/build.gradle.kts, so a channel that moves underneath us silently
# changes what ships. release.yml still tracks stable; this job is the one that
# tells us a version bump is coming before it lands in an artifact.

name: flutter

on:
  push:
    branches: [main]
    tags: ['v*']              # the ios-release job below runs only here
    paths: ['app/flutter/**', 'c/**', 'ais_engine.podspec', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['app/flutter/**', 'c/**', 'ais_engine.podspec', '.github/workflows/flutter.yml']
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      # `lib` only: tool/ holds standalone verification scripts that print to
      # stdout on purpose, and their avoid_print infos are not a signal.
      - name: analyze
        run: flutter analyze lib

      - name: test
        run: flutter test

      # The version the About screen falls back to when a build passes no
      # --dart-define. It had drifted five releases behind pubspec, so a bug
      # report quoted a version that was never shipped. Cheap to keep honest.
      - name: version.dart defaults match pubspec
        run: |
          pv=$(sed -n 's/^version: *\([0-9.]*\)+\([0-9]*\).*/\1 \2/p' pubspec.yaml)
          pname=$(echo "$pv" | cut -d' ' -f1)
          pcode=$(echo "$pv" | cut -d' ' -f2)
          dname=$(sed -n "s/.*APP_VERSION', defaultValue: '\([^']*\)'.*/\1/p" lib/version.dart)
          dcode=$(sed -n "s/.*APP_BUILD', defaultValue: '\([^']*\)'.*/\1/p" lib/version.dart)
          echo "pubspec: $pname+$pcode   version.dart: $dname+$dcode"
          if [ "$pname" != "$dname" ] || [ "$pcode" != "$dcode" ]; then
            echo "::error::lib/version.dart defaults ($dname+$dcode) do not match pubspec.yaml ($pname+$pcode)"
            exit 1
          fi

  # The desktop UI layer. It SKIPS on the developer's machine (Pop!_OS cannot
  # install the GTK/ninja toolchain without downgrading the running session's
  # Wayland libraries), so the harness that drives the real Host/Join sync UI had
  # never run anywhere. Here it does, and what it proves today is that the Linux
  # desktop app still BUILDS and launches against the engine -- which is a real
  # gate, and the reason the job stays.
  #
  # What it cannot yet prove is anything about the UI: under Xvfb every frame
  # comes out SOLID BLACK, so the driver clicks blind and asserts nothing. It is
  # not the coordinates and not the toolchain: libgl1-mesa-dri, libegl1, libgles2
  # and LIBGL_ALWAYS_SOFTWARE=1 are all in place and the screen is 24-bit. Until
  # somebody makes Flutter's GTK embedder rasterise in software on a headless
  # runner, the drive step reports rather than gates, and the Android layers
  # (tests/gui/flutter-*-android.sh) are where real UI coverage lives.
  desktop-ui:
    name: flutter sync UI (linux desktop, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: the toolchain the desktop build and the driver need
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang cmake pkg-config \
                                  libgtk-3-dev xvfb xdotool imagemagick \
                                  libgl1-mesa-dri libegl1 libegl-mesa0 libgles2 libglu1-mesa

      - name: build the engine the app binds to
        run: make

      - name: the linux desktop target, in case the SDK ships it off
        run: flutter config --enable-linux-desktop

      - name: drive the real Host/Join UI against a CLI peer
        continue-on-error: true      # see the note above: it renders black here
        run: sh tests/gui/flutter-sync.sh
        env:
          # the harness starts its own Xvfb; this only keeps GTK off Wayland
          GDK_BACKEND: x11
          # and it deletes its work dir on the way out unless told otherwise,
          # which took the per-step screenshots with it -- the only evidence of
          # WHY a step missed, on a machine nobody can watch
          KEEP: '1'
          # Flutter draws through EGL/GLES, and Xvfb has no GPU. Without a
          # software rasteriser every frame came out SOLID BLACK, which reads
          # like a driver that missed its target rather than a missing driver.
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe

      # The harness drives a real window, so its per-step screenshots are the
      # only way to see WHY a step missed; without them a failure here is a
      # guess. It writes them to a fixed path (see uitest/run.sh WORK).
      - name: keep the screenshots either way
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-shots
          path: /tmp/ais-uitest/shots/
          if-no-files-found: warn

  # The SIGNED build for App Store Connect, on a version tag only. Every step
  # after the gate skips itself until the six IOS_*/APPSTORE_* secrets exist
  # (doc/dev/IOS_RELEASE.md step 6 has the table), the way release.yml's android
  # job falls back without its keystore -- so forks and the pre-enrolment repo
  # pass this job trivially. ios/ExportOptions.plist and the pbxproj Release
  # config carry a YOUR_TEAM_ID placeholder until enrolment issues the real one;
  # the gate keeps that placeholder from ever reaching an export.
  ios-release:
    name: ios release (signed, tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # tool/version.sh derives the build number from the tag

      - name: gate on the signing secrets
        id: gate
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
        run: |
          if [ -n "$P12" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "no IOS_DIST_P12_BASE64 secret; skipping the signed build"
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.go == 'yes'
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: pub get
        if: steps.gate.outputs.go == 'yes'
        run: flutter pub get

      # Keychain password is throwaway (the keychain dies with the runner).
      # Both profile directories are written because Xcode 16 moved the
      # location and still reads the old one.
      - name: signing material
        if: steps.gate.outputs.go == 'yes'
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEY: ${{ secrets.APPSTORE_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          RUNNER_KC=$(openssl rand -hex 16)
          security create-keychain -p "$RUNNER_KC" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "$RUNNER_KC" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          echo "$P12" | base64 -d > /tmp/d.p12
          security import /tmp/d.p12 -k build.keychain -P "$P12_PASS" \
                   -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
                   -s -k "$RUNNER_KC" build.keychain
          for d in ~/Library/MobileDevice/Provisioning\ Profiles \
                   ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
            mkdir -p "$d"
            echo "$PROFILE" | base64 -d > "$d/ais.mobileprovision"
          done
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

      # The version flags are NOT optional: CFBundleVersion must rise on every
      # upload or App Store Connect rejects it; tool/version.sh derives it from
      # the tag and the commit count (doc/dev/VERSIONING.md).
      - name: build the signed ipa
        if: steps.gate.outputs.go == 'yes'
        run: |
          flutter build ipa --release $(sh tool/version.sh) \
                --export-options-plist=ios/ExportOptions.plist

      # altool is deprecated for uploads; if it starts refusing, switch to
      # `destination: upload` in ExportOptions.plist or iTMSTransporter
      # (doc/dev/IOS_TODO.md step 6).
      - name: upload to App Store Connect
        if: steps.gate.outputs.go == 'yes'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -t ios -f build/ios/ipa/*.ipa \
                --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

  # Does the app still COMPILE for iPhone? No Apple account is involved: a
  # macOS runner carries the iOS SDKs, and --no-codesign skips the signing that
  # a certificate would be needed for. What this catches is the wiring in
  # ais_engine.podspec going stale -- a c/*.c added and not linked, or the
  # crypto sources dropped, which is a link error here rather than a crash on
  # someone's phone. Signing, a real device and TestFlight stay manual
  # (issue #1).
  ios-build:
    name: ios build (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe stamps AIS_VERSION

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      # The stamp is taken BEFORE the build, as the podspec takes it: the build
      # dirties the checkout, and a `git describe --dirty` read afterwards
      # expects a "-dirty" suffix the binary was never given.
      - name: the version this checkout carries
        run: echo "AIS_WANT=$(git describe --tags --always --dirty | sed 's/^v//')" >> "$GITHUB_ENV"

      - name: build (unsigned, device arm64)
        run: flutter build ios --release --no-codesign

      # The engine is only useful if its symbols survived into the binary:
      # DynamicLibrary.process() resolves them by name at runtime, so a build
      # that dropped them fails on the first engine call rather than here.
      - name: the engine is in the app binary
        run: |
          app=build/ios/iphoneos/Runner.app
          bin="$app/Runner"
          if nm -gU "$bin" 2>/dev/null | grep -q ais_embed_open; then
            echo "ais_embed_open: in the app binary"
          elif ls "$app/Frameworks"/ais_engine.framework/ais_engine >/dev/null 2>&1 &&
               nm -gU "$app/Frameworks"/ais_engine.framework/ais_engine | grep -q ais_embed_open; then
            echo "ais_embed_open: in the bundled ais_engine framework"
          else
            echo "ais_embed_open is in neither the app binary nor a bundled framework:"
            echo "the app would launch and then fail on its first engine call."
            exit 1
          fi

      # AIS_VERSION is stamped from the git tag by ais_engine.podspec. Unstamped,
      # About reports ais.h's 0.0.0-dev fallback, which is the whole reason the
      # About screen exists: a bug report has to name the engine it was filed
      # against. The stamp is a preprocessor define reaching the compiler through
      # an xcconfig, which is quiet when it goes wrong, so assert the string is
      # actually in the binary.
      - name: the engine knows its own version
        run: |
          want=$AIS_WANT
          app=build/ios/iphoneos/Runner.app
          bin=$(ls "$app/Frameworks"/ais_engine.framework/ais_engine 2>/dev/null || echo "$app/Runner")
          if strings "$bin" | grep -qx "$want"; then
            echo "engine version in the binary: $want"
          else
            echo "expected the engine to carry version '$want'; it does not."
            echo "About would report the 0.0.0-dev fallback on iOS."
            exit 1
          fi

      # Everything above proves the engine COMPILED and shipped. Only running
      # the app proves DynamicLibrary.process() resolves it: the symbols are
      # looked up by name at launch, so a build that shipped them somewhere the
      # loader cannot see fails on the first engine call and nowhere earlier.
      # The app opens its index on startup and the engine writes `version` into
      # it, so that file appearing is the engine having actually run.
      - name: the engine runs on a simulator
        run: |
          set -eo pipefail
          flutter build ios --simulator --debug
          udid=$(xcrun simctl list devices available --json | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; print(next(d['udid'] for r,v in ds.items() if 'iOS' in r for d in v if d.get('isAvailable') and 'iPhone' in d['name']))") \
            || { echo "no iPhone simulator available on this runner"; exit 1; }
          echo "simulator: $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          xcrun simctl install "$udid" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$udid" com.aisindex.ais
          data=$(xcrun simctl get_app_container "$udid" com.aisindex.ais data)
          for i in $(seq 1 40); do
            if [ -f "$data/Documents/ais/version" ]; then
              echo "the engine opened its index: format v$(cat "$data/Documents/ais/version")"
              exit 0
            fi
            sleep 1
          done
          echo "the app launched but never opened an index:"
          echo "DynamicLibrary.process() did not resolve the engine."
          xcrun simctl spawn "$udid" log show --last 2m --predicate 'process == "Runner"' \
            --style compact 2>/dev/null | tail -40 || true
          exit 1
